description "chromedrop web UI"

start on started system-services
stop on stopping system-services
respawn
respawn limit 10 60
kill timeout 20

env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env LD_LIBRARY_PATH=/usr/local/lib64:/usr/local/lib:/lib64:/usr/lib64
env PYTHONUNBUFFERED=1
env PYTHONIOENCODING=UTF-8

script
    DOWNLOAD_DIR=$(echo /home/chronos/u-*/MyFiles/Downloads)
    exec /usr/local/bin/python3 /usr/local/lib/chromedrop/chromedrop-web.py > "${DOWNLOAD_DIR}/upstart-error.log" 2>&1
end script

post-stop script
    exec /usr/local/lib/chromedrop/restore-wifi.sh
end script
