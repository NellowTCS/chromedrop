description "chromedrop web UI"

start on started system-services and started bluetoothd
stop on stopping system-services
respawn
respawn limit 10 60
kill timeout 20
oom score -100

env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env LD_LIBRARY_PATH=/usr/local/lib64:/usr/local/lib:/lib64:/usr/lib64
env DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
env PYTHONUNBUFFERED=1
env PYTHONIOENCODING=UTF-8

script
    exec /usr/local/bin/python3 /usr/local/lib/chromedrop/chromedrop-web.py >/var/log/chromedrop-web.log 2>&1
end script

post-stop script
    exec /usr/local/lib/chromedrop/restore-wifi.sh >>/var/log/chromedrop-web.log 2>&1
end script
