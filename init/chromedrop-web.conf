description "chromedrop web UI (http://localhost:8780)"
start on started system-services
stop on stopping system-services

respawn
respawn limit 10 60
kill timeout 20

env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

script
  exec /usr/bin/python3 /usr/local/lib/chromedrop/chromedrop-web.py >/dev/null 2>&1 &
end script

post-stop exec /usr/local/lib/chromedrop/restore-wifi.sh
