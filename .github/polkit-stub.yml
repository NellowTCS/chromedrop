name: polkit-stub
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path polkit-stub/Cargo.toml
          cp polkit-stub/target/x86_64-unknown-linux-musl/release/polkit-stub polkit-stub-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: polkit-stub-x86_64
